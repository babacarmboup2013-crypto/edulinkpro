<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d4d38"/>
      <stop offset="1" stop-color="#0a3a2b"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16a374"/>
      <stop offset="1" stop-color="#0a4f3a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4a34a"/>
      <stop offset="1" stop-color="#b8862f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="960" height="600" fill="url(#bg)"/>
  <circle cx="860" cy="60" r="220" fill="#ffffff" opacity="0.04"/>
  <circle cx="120" cy="560" r="260" fill="#ffffff" opacity="0.04"/>

  <!-- Central shield -->
  <g filter="url(#shadow)">
    <path d="M480 120 L620 175 v140 c0 85 -55 148 -140 185 c-85 -37 -140 -100 -140 -185 v-140 Z"
          fill="url(#shield)" stroke="#1fd1a0" stroke-width="4"/>
    <path d="M480 120 L620 175 v140 c0 85 -55 148 -140 185 c-85 -37 -140 -100 -140 -185 v-140 Z"
          fill="url(#shield)"/>
    <!-- padlock -->
    <g transform="translate(480 300)">
      <rect x="-34" y="-6" width="68" height="52" rx="10" fill="#eafff6"/>
      <path d="M-20 -6 V-34 a20 20 0 0 1 40 0 V-6" fill="none" stroke="#eafff6" stroke-width="9"/>
      <circle cx="0" cy="20" r="8" fill="#b8862f"/>
      <rect x="-12" y="28" width="24" height="8" rx="4" fill="#b8862f"/>
    </g>
    <!-- check inside shield top -->
    <path d="M520 235 l-16 16 l-9 -9" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  </g>

  <!-- Role cards -->
  <!-- School -->
  <g filter="url(#cardShadow)" transform="translate(120 90)">
    <rect width="176" height="60" rx="14" fill="#0d5a42"/>
    <circle cx="44" cy="30" r="18" fill="#1fd1a0"/>
    <g transform="translate(44 30)">
      <path d="M0 -9 L14 3 H4 v9 H-4 v-9 H-14 Z" fill="#0a4f3a"/>
    </g>
    <text x="74" y="26" font-family="'Inter',sans-serif" font-size="17" font-weight="700" fill="#eafff6">École</text>
    <text x="74" y="46" font-family="'Inter',sans-serif" font-size="12" fill="#8fd8bd">Code école</text>
  </g>

  <!-- IEF -->
  <g filter="url(#cardShadow)" transform="translate(120 500)">
    <rect width="176" height="60" rx="14" fill="#0d5a42"/>
    <circle cx="44" cy="30" r="18" fill="#ecc76a"/>
    <text x="30" y="37" font-family="'Inter',sans-serif" font-size="15" font-weight="800" fill="#7a5a1f">IEF</text>
    <text x="74" y="26" font-family="'Inter',sans-serif" font-size="17" font-weight="700" fill="#eafff6">Inspection</text>
    <text x="74" y="46" font-family="'Inter',sans-serif" font-size="12" fill="#8fd8bd">Lecture seule</text>
  </g>

  <!-- Super Admin -->
  <g filter="url(#cardShadow)" transform="translate(676 90)">
    <rect width="176" height="60" rx="14" fill="#0d5a42"/>
    <circle cx="44" cy="30" r="18" fill="#d84f4f"/>
    <g transform="translate(44 30)">
      <path d="M0 -7 l7 14 h-14 Z" fill="#7a1f1f"/>
      <rect x="-6" y="3" width="12" height="4" rx="2" fill="#0a4f3a"/>
    </g>
    <text x="74" y="26" font-family="'Inter',sans-serif" font-size="13" font-weight="700" fill="#eafff6">Super Admin</text>
    <text x="74" y="46" font-family="'Inter',sans-serif" font-size="12" fill="#8fd8bd">Contrôle total</text>
  </g>

  <!-- Anti brute-force (bottom left of shield) -->
  <g filter="url(#cardShadow)" transform="translate(676 500)">
    <rect width="176" height="60" rx="14" fill="#0d5a42"/>
    <circle cx="44" cy="30" r="18" fill="#8b5cf6"/>
    <g transform="translate(44 30)">
      <circle r="9" fill="none" stroke="#0a4f3a" stroke-width="3"/>
      <path d="M0 -9 V0 L6 5" fill="none" stroke="#0a4f3a" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="74" y="22" font-family="'Inter',sans-serif" font-size="13.5" font-weight="700" fill="#eafff6">Anti brute-force</text>
    <text x="74" y="42" font-family="'Inter',sans-serif" font-size="12" fill="#8fd8bd">Historique complet</text>
  </g>

  <!-- Top sub-band -->
  <text x="480" y="60" text-anchor="middle" font-family="'Inter',sans-serif" font-size="26" font-weight="800" fill="#1fd1a0" letter-spacing="4">SÉCURITÉ MULTI-NIVEAUX</text>
  <text x="480" y="560" text-anchor="middle" font-family="'Inter',sans-serif" font-size="18" fill="#cfe9dc">Codes chiffrés  ·  Rôles école / IEF / Super Admin</text>
</svg>
