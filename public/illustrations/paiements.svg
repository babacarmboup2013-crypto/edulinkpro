<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecc76a"/>
      <stop offset="1" stop-color="#d4a017"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="960" height="600" fill="url(#bg)"/>
  <circle cx="60" cy="60" r="220" fill="#ffffff" opacity="0.04"/>
  <circle cx="900" cy="540" r="260" fill="#ffffff" opacity="0.04"/>

  <!-- Money note -->
  <g filter="url(#cardShadow)" transform="translate(340 120)">
    <rect width="280" height="180" rx="20" fill="#0f172a" stroke="url(#gold)" stroke-width="3" transform="rotate(-8 140 90)"/>
    <circle cx="140" cy="90" r="40" fill="none" stroke="#d4a017" stroke-width="4" transform="rotate(-8 140 90)"/>
    <text x="140" y="78" text-anchor="middle" font-family="'Inter',sans-serif" font-size="15" font-weight="800" fill="#ecc76a" transform="rotate(-8 140 90)">F CFA</text>
    <text x="140" y="102" text-anchor="middle" font-family="'Inter',sans-serif" font-size="26" font-weight="800" fill="#ffffff" transform="rotate(-8 140 90)">18 500</text>
    <text x="140" y="238" text-anchor="middle" font-family="'Inter',sans-serif" font-size="14" font-weight="700" fill="#94a3b8">PENSION SCOLAIRE</text>
  </g>

  <!-- receipt card -->
  <g filter="url(#cardShadow)" transform="translate(190 360)">
    <rect width="300" height="170" rx="16" fill="#0f172a"/>
    <rect x="0" y="0" width="300" height="34" rx="16" fill="#3b82f6"/>
    <rect x="0" y="16" width="300" height="18" fill="#3b82f6"/>
    <text x="150" y="24" text-anchor="middle" font-family="'Inter',sans-serif" font-size="14" font-weight="800" fill="#e2e8f0">REÇU N° 2041</text>
    <text x="28" y="64" font-family="'Inter',sans-serif" font-size="13" fill="#94a3b8">Scolarité · Janvier</text>
    <text x="272" y="64" text-anchor="end" font-family="'Inter',sans-serif" font-size="14" font-weight="800" fill="#ecc76a">12 000 F</text>
    <text x="28" y="94" font-family="'Inter',sans-serif" font-size="13" fill="#94a3b8">Cantine</text>
    <text x="272" y="94" text-anchor="end" font-family="'Inter',sans-serif" font-size="14" font-weight="800" fill="#ecc76a">6 500 F</text>
    <line x1="28" y1="112" x2="272" y2="112" stroke="#1e40af" stroke-width="2"/>
    <text x="28" y="138" font-family="'Inter',sans-serif" font-size="15" font-weight="800" fill="#e2e8f0">Total</text>
    <text x="272" y="140" text-anchor="end" font-family="'Inter',sans-serif" font-size="17" font-weight="800" fill="#ecc76a">18 500 F</text>
  </g>

  <!-- payment success chip -->
  <g filter="url(#cardShadow)" transform="translate(560 380)">
    <rect width="200" height="66" rx="16" fill="#0f172a"/>
    <circle cx="33" cy="33" r="17" fill="url(#green)"/>
    <svg x="22" y="22" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#020617" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    <text x="62" y="29" font-family="'Inter',sans-serif" font-size="15" font-weight="800" fill="#e2e8f0">Payé</text>
    <text x="62" y="48" font-family="'Inter',sans-serif" font-size="11" fill="#94a3b8">86% recouvrement</text>
  </g>

  <text x="480" y="565" text-anchor="middle" font-family="'Inter',sans-serif" font-size="18" fill="#cbd5e1">Pensions · Recouvrement · Recettes école</text>
</svg>
