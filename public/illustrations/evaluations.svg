<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d4d38"/>
      <stop offset="1" stop-color="#0a3a2b"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1fd1a0"/>
      <stop offset="1" stop-color="#16a374"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecc76a"/>
      <stop offset="1" stop-color="#b8862f"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="960" height="600" fill="url(#bg)"/>
  <circle cx="900" cy="60" r="220" fill="#ffffff" opacity="0.04"/>
  <circle cx="60" cy="560" r="260" fill="#ffffff" opacity="0.04"/>

  <!-- Report card (bulletin) -->
  <g filter="url(#cardShadow)" transform="translate(260 90)">
    <rect width="440" height="320" rx="22" fill="#0e5a42" stroke="#1fd1a0" stroke-width="3"/>
    <rect x="0" y="0" width="440" height="58" rx="22" fill="#16a374"/>
    <rect x="0" y="28" width="440" height="30" fill="#16a374"/>
    <text x="220" y="38" text-anchor="middle" font-family="'Inter',sans-serif" font-size="19" font-weight="800" fill="#eafff6">BULLETIN DE NOTES — 1er TRIMESTRE</text>
    <text x="40" y="96" font-family="'Inter',sans-serif" font-size="13" fill="#8fd8bd">Awa Diop · CE2 · Section A</text>
    <line x1="40" y1="112" x2="660" y2="112" stroke="#1a7a5c" stroke-width="2"/>

    <!-- score rows -->
    <g font-family="'Inter',sans-serif">
      <text x="40" y="150" font-size="16" font-weight="700" fill="#ffffff">Mathématiques</text>
      <text x="420" y="150" text-anchor="end" font-size="17" font-weight="800" fill="#ecc76a">16 / 20</text>
      <rect x="40" y="160" width="62" height="8" rx="4" fill="url(#green)"/>
      <rect x="102" y="160" width="358" height="8" rx="4" fill="#1a7a5c"/>

      <text x="40" y="200" font-size="16" font-weight="700" fill="#ffffff">Français</text>
      <text x="420" y="200" text-anchor="end" font-size="17" font-weight="800" fill="#ecc76a">14 / 20</text>
      <rect x="40" y="210" width="54" height="8" rx="4" fill="url(#green)"/>
      <rect x="94" y="210" width="366" height="8" rx="4" fill="#1a7a5c"/>

      <text x="40" y="250" font-size="16" font-weight="700" fill="#ffffff">Sciences</text>
      <text x="420" y="250" text-anchor="end" font-size="17" font-weight="800" fill="#ecc76a">18 / 20</text>
      <rect x="40" y="260" width="70" height="8" rx="4" fill="url(#green)"/>
      <rect x="110" y="260" width="350" height="8" rx="4" fill="#1a7a5c"/>

      <text x="40" y="300" font-size="16" font-weight="700" fill="#ffffff">Histoire-Géo</text>
      <text x="420" y="300" text-anchor="end" font-size="17" font-weight="800" fill="#ecc76a">15 / 20</text>
      <rect x="40" y="310" width="58" height="8" rx="4" fill="url(#green)"/>
      <rect x="98" y="310" width="362" height="8" rx="4" fill="#1a7a5c"/>
    </g>
    <rect x="40" y="336" width="360" height="42" rx="12" fill="#ffffff" opacity="0.08"/>
    <text x="58" y="363" font-family="'Inter',sans-serif" font-size="15" font-weight="800" fill="#eafff6">Moyenne générale</text>
    <text x="378" y="363" text-anchor="end" font-family="'Inter',sans-serif" font-size="18" font-weight="800" fill="#ecc76a">15,75 / 20</text>
  </g>

  <!-- floating grade badge -->
  <g filter="url(#cardShadow)" transform="translate(120 300)">
    <rect width="140" height="72" rx="14" fill="#0e5a42"/>
    <circle cx="30" cy="36" r="17" fill="url(#gold)"/>
    <text x="24" y="42" text-anchor="middle" font-family="'Inter',sans-serif" font-size="17" font-weight="800" fill="#7a5a1f">A+</text>
    <text x="58" y="32" font-family="'Inter',sans-serif" font-size="14" font-weight="700" fill="#eafff6">Palmarès</text>
    <text x="58" y="50" font-family="'Inter',sans-serif" font-size="10" fill="#8fd8bd">classement</text>
  </g>

  <g filter="url(#cardShadow)" transform="translate(700 330)">
    <rect width="170" height="60" rx="14" fill="#0e5a42"/>
    <circle cx="28" cy="30" r="16" fill="url(#green)"/>
    <svg x="18" y="20" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0a4f3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 17 9 11 13 15 21 7"/><line x1="15" y1="7" x2="21" y2="7"/><line x1="21" y1="7" x2="21" y2="13"/></svg>
    <text x="56" y="26" font-family="'Inter',sans-serif" font-size="13" font-weight="700" fill="#eafff6">Export PDF</text>
    <text x="56" y="44" font-family="'Inter',sans-serif" font-size="10" fill="#8fd8bd">professionnel</text>
  </g>

  <text x="480" y="540" text-anchor="middle" font-family="'Inter',sans-serif" font-size="18" fill="#cfe9dc">Notes · Bulletins · Relevés · Palmarès</text>
</svg>
