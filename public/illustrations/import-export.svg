<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d4d38"/>
      <stop offset="1" stop-color="#0a3a2b"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1fd1a0"/>
      <stop offset="1" stop-color="#16a374"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecc76a"/>
      <stop offset="1" stop-color="#b8862f"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="960" height="600" fill="url(#bg)"/>
  <circle cx="900" cy="60" r="220" fill="#ffffff" opacity="0.04"/>
  <circle cx="60" cy="560" r="260" fill="#ffffff" opacity="0.04"/>

  <!-- Central database cylinder -->
  <g filter="url(#cardShadow)">
    <ellipse cx="480" cy="180" rx="150" ry="34" fill="#16a374"/>
    <path d="M330 180 V380 a150 34 0 0 0 300 0 V180 a150 34 0 0 0 -300 0 Z" fill="#0e5a42" stroke="#1fd1a0" stroke-width="3"/>
    <path d="M330 220 a150 34 0 0 0 300 0" fill="none" stroke="#1a7a5c" stroke-width="3"/>
    <ellipse cx="480" cy="220" rx="150" ry="34" fill="#1a7a5c" opacity="0.4"/>
    <!-- rows -->
    <g transform="translate(430 260)">
      <rect width="100" height="12" rx="6" fill="#16a374"/>
      <rect x="0" y="24" width="100" height="12" rx="6" fill="#1fd1a0"/>
      <rect x="0" y="48" width="100" height="12" rx="6" fill="#b8862f"/>
    </g>
  </g>

  <!-- cloud -->
  <path d="M200 210 a42 42 0 0 1 42 42 a34 34 0 0 1 62 6 h-10 a26 26 0 0 0 38 10 a38 38 0 0 0 -40 68 l-92 0 a34 34 0 0 1 0 -126 Z"
        fill="url(#green)" filter="url(#cardShadow)"/>
  <rect x="212" y="272" width="120" height="40" rx="10" fill="none" stroke="#eafff6" stroke-width="4" transform="translate(0 0)"/>

  <!-- down/import arrow into cloud -->
  <g transform="translate(272 260)">
    <line x1="0" y1="-40" x2="0" y2="12" stroke="#eafff6" stroke-width="7" stroke-linecap="round"/>
    <polyline points="-14 -6 0 12 14 -6" fill="none" stroke="#eafff6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- export arrow out to right -->
  <g transform="translate(700 300)">
    <circle cx="0" cy="0" r="34" fill="#0e5a42" stroke="url(#gold)" stroke-width="3" filter="url(#cardShadow)"/>
    <polyline points="-12 0 12 0 -4 -8" fill="none" stroke="#ecc76a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="-12 0 12 0 -4 8" fill="none" stroke="#ecc76a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- file chip -->
  <g filter="url(#cardShadow)" transform="translate(200 420)">
    <rect width="180" height="64" rx="14" fill="#0e5a42"/>
    <rect x="14" y="14" width="20" height="26" rx="4" fill="url(#green)"/>
    <text x="46" y="31" font-family="'Inter',sans-serif" font-size="14" font-weight="700" fill="#eafff6">Export CSV / PDF</text>
    <text x="46" y="48" font-family="'Inter',sans-serif" font-size="10" fill="#8fd8bd">bulletins &amp; listes</text>
  </g>

  <g filter="url(#cardShadow)" transform="translate(580 420)">
    <rect width="200" height="64" rx="14" fill="#0e5a42"/>
    <rect x="14" y="14" width="20" height="26" rx="4" fill="url(#gold)"/>
    <text x="46" y="31" font-family="'Inter',sans-serif" font-size="14" font-weight="700" fill="#eafff6">Migrations</text>
    <text x="46" y="48" font-family="'Inter',sans-serif" font-size="10" fill="#8fd8bd">entre écoles</text>
  </g>

  <text x="480" y="555" text-anchor="middle" font-family="'Inter',sans-serif" font-size="18" fill="#cfe9dc">Import · Export · Migration entre écoles</text>
</svg>
