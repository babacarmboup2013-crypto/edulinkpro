<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecc76a"/>
      <stop offset="1" stop-color="#d4a017"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#22d3ee" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="960" height="600" fill="url(#bg)"/>
  <circle cx="880" cy="50" r="220" fill="#ffffff" opacity="0.04"/>
  <circle cx="60" cy="560" r="260" fill="#ffffff" opacity="0.04"/>

  <!-- Monitor frame -->
  <g filter="url(#cardShadow)">
    <rect x="300" y="90" width="360" height="300" rx="22" fill="#0f172a" stroke="#22d3ee" stroke-width="3"/>
    <!-- top bar -->
    <rect x="300" y="90" width="360" height="52" rx="22" fill="#3b82f6"/>
    <rect x="300" y="110" width="360" height="32" fill="#3b82f6"/>
    <text x="330" y="126" font-family="'Inter',sans-serif" font-size="18" font-weight="800" fill="#e2e8f0">TABLEAU DE BORD</text>
    <circle cx="610" cy="116" r="6" fill="#e2e8f0" opacity="0.7"/>
    <circle cx="630" cy="116" r="6" fill="#e2e8f0" opacity="0.5"/>
    <!-- KPI cards -->
    <g transform="translate(330 175)">
      <rect width="150" height="62" rx="12" fill="#ffffff" opacity="0.1"/>
      <text x="15" y="22" font-family="'Inter',sans-serif" font-size="12" fill="#94a3b8">Élèves</text>
      <text x="15" y="48" font-family="'Inter',sans-serif" font-size="26" font-weight="800" fill="#ffffff">1 240</text>
    </g>
    <g transform="translate(500 175)">
      <rect width="150" height="62" rx="12" fill="#ffffff" opacity="0.1"/>
      <text x="15" y="22" font-family="'Inter',sans-serif" font-size="12" fill="#94a3b8">Présents</text>
      <text x="15" y="48" font-family="'Inter',sans-serif" font-size="26" font-weight="800" fill="#ecc76a">98%</text>
    </g>
    <!-- bar chart -->
    <g transform="translate(330 270)">
      <text x="0" y="0" font-family="'Inter',sans-serif" font-size="12" fill="#94a3b8">Présences de la semaine</text>
      <rect x="20" y="40" width="34" height="70" rx="6" fill="#3b82f6"/>
      <rect x="66" y="28" width="34" height="82" rx="6" fill="#22d3ee"/>
      <rect x="112" y="52" width="34" height="58" rx="6" fill="#d4a017"/>
      <rect x="158" y="20" width="34" height="90" rx="6" fill="#3b82f6"/>
      <rect x="204" y="38" width="34" height="72" rx="6" fill="#22d3ee"/>
      <rect x="250" y="48" width="34" height="62" rx="6" fill="#d4a017"/>
    </g>
  </g>

  <!-- Floating donut card -->
  <g filter="url(#cardShadow)" transform="translate(140 320)">
    <rect width="180" height="130" rx="16" fill="#0f172a"/>
    <text x="90" y="24" text-anchor="middle" font-family="'Inter',sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">Paiements</text>
    <circle cx="90" cy="72" r="34" fill="none" stroke="#25476a" stroke-width="13"/>
    <path d="M90 38 a34 34 0 0 1 28 50" fill="none" stroke="url(#gold)" stroke-width="13" stroke-linecap="round"/>
    <path d="M90 38 a34 34 0 0 0 -28 50" fill="none" stroke="url(#green)" stroke-width="13" stroke-linecap="round"/>
    <text x="90" y="70" text-anchor="middle" font-family="'Inter',sans-serif" font-size="14" font-weight="800" fill="#ffffff">84%</text>
    <text x="90" y="85" text-anchor="middle" font-family="'Inter',sans-serif" font-size="9" fill="#94a3b8">payé</text>
  </g>

  <!-- Floating stat card -->
  <g filter="url(#cardShadow)" transform="translate(640 360)">
    <rect width="190" height="70" rx="14" fill="#0f172a"/>
    <circle cx="34" cy="35" r="18" fill="url(#green)"/>
    <svg x="24" y="25" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#020617" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/></svg>
    <text x="66" y="31" font-family="'Inter',sans-serif" font-size="15" font-weight="800" fill="#e2e8f0">+18%</text>
    <text x="66" y="48" font-family="'Inter',sans-serif" font-size="11" fill="#94a3b8">vs mois dernier</text>
  </g>

  <text x="480" y="540" text-anchor="middle" font-family="'Inter',sans-serif" font-size="18" fill="#cbd5e1">Effectifs · Présences · Synthèse temps réel</text>
</svg>
