<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecc76a"/>
      <stop offset="1" stop-color="#d4a017"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="960" height="600" fill="url(#bg)"/>
  <circle cx="60" cy="80" r="220" fill="#ffffff" opacity="0.04"/>
  <circle cx="900" cy="540" r="260" fill="#ffffff" opacity="0.04"/>

  <text x="480" y="70" text-anchor="middle" font-family="'Inter',sans-serif" font-size="26" font-weight="800" fill="#22d3ee" letter-spacing="3">ÉLÈVES &amp; PERSONNEL</text>

  <!-- Student card -->
  <g filter="url(#cardShadow)" transform="translate(150 120)">
    <rect width="300" height="240" rx="20" fill="#0f172a" stroke="#22d3ee" stroke-width="2.5"/>
    <!-- avatar -->
    <circle cx="150" cy="86" r="42" fill="url(#green)"/>
    <circle cx="150" cy="76" r="16" fill="#020617"/>
    <path d="M150 66 a18 18 0 0 1 18 18 h-36 a18 18 0 0 1 18 -18 Z" fill="#020617" transform="translate(0 26)"/>
    <text x="150" y="150" text-anchor="middle" font-family="'Inter',sans-serif" font-size="18" font-weight="800" fill="#ffffff">Awa Diop</text>
    <text x="150" y="172" text-anchor="middle" font-family="'Inter',sans-serif" font-size="12" fill="#94a3b8">Classe CE2 · Section A</text>
    <rect x="60" y="192" width="180" height="30" rx="15" fill="#3b82f6"/>
    <text x="150" y="212" text-anchor="middle" font-family="'Inter',sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">FICHE ÉLÈVE COMPLÈTE</text>
  </g>

  <!-- Staff card -->
  <g filter="url(#cardShadow)" transform="translate(520 120)">
    <rect width="300" height="240" rx="20" fill="#0f172a" stroke="#d4a017" stroke-width="2.5"/>
    <!-- avatar -->
    <circle cx="150" cy="86" r="42" fill="url(#gold)"/>
    <circle cx="150" cy="76" r="16" fill="#92710c"/>
    <path d="M150 66 a18 18 0 0 1 18 18 h-36 a18 18 0 0 1 18 -18 Z" fill="#92710c" transform="translate(0 26)"/>
    <text x="150" y="150" text-anchor="middle" font-family="'Inter',sans-serif" font-size="18" font-weight="800" fill="#ffffff">Omar Ndiaye</text>
    <text x="150" y="172" text-anchor="middle" font-family="'Inter',sans-serif" font-size="12" fill="#94a3b8">Professeur de Mathématiques</text>
    <rect x="60" y="192" width="180" height="30" rx="15" fill="#d4a017"/>
    <text x="150" y="212" text-anchor="middle" font-family="'Inter',sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">ENSEIGNANT · RÔLE</text>
  </g>

  <!-- photo / badge chips at bottom -->
  <g filter="url(#cardShadow)" transform="translate(300 400)">
    <rect width="140" height="52" rx="12" fill="#0f172a"/>
    <circle cx="26" cy="26" r="13" fill="url(#green)"/>
    <text x="48" y="23" font-family="'Inter',sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">Photos</text>
    <text x="48" y="40" font-family="'Inter',sans-serif" font-size="10" fill="#94a3b8">fiches</text>
  </g>
  <g filter="url(#cardShadow)" transform="translate(540 400)">
    <rect width="140" height="52" rx="12" fill="#0f172a"/>
    <circle cx="26" cy="26" r="13" fill="url(#gold)"/>
    <text x="48" y="23" font-family="'Inter',sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">Classes</text>
    <text x="48" y="40" font-family="'Inter',sans-serif" font-size="10" fill="#94a3b8">groupes</text>
  </g>

  <text x="480" y="530" text-anchor="middle" font-family="'Inter',sans-serif" font-size="18" fill="#cbd5e1">Fiches complètes · Photos · Rôles de connexion</text>
</svg>
