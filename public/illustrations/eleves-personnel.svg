<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d4d38"/>
      <stop offset="1" stop-color="#0a3a2b"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1fd1a0"/>
      <stop offset="1" stop-color="#16a374"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecc76a"/>
      <stop offset="1" stop-color="#b8862f"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="960" height="600" fill="url(#bg)"/>
  <circle cx="60" cy="80" r="220" fill="#ffffff" opacity="0.04"/>
  <circle cx="900" cy="540" r="260" fill="#ffffff" opacity="0.04"/>

  <text x="480" y="70" text-anchor="middle" font-family="'Inter',sans-serif" font-size="26" font-weight="800" fill="#1fd1a0" letter-spacing="3">ÉLÈVES &amp; PERSONNEL</text>

  <!-- Student card -->
  <g filter="url(#cardShadow)" transform="translate(150 120)">
    <rect width="300" height="240" rx="20" fill="#0e5a42" stroke="#1fd1a0" stroke-width="2.5"/>
    <!-- avatar -->
    <circle cx="150" cy="86" r="42" fill="url(#green)"/>
    <circle cx="150" cy="76" r="16" fill="#0a4f3a"/>
    <path d="M150 66 a18 18 0 0 1 18 18 h-36 a18 18 0 0 1 18 -18 Z" fill="#0a4f3a" transform="translate(0 26)"/>
    <text x="150" y="150" text-anchor="middle" font-family="'Inter',sans-serif" font-size="18" font-weight="800" fill="#ffffff">Awa Diop</text>
    <text x="150" y="172" text-anchor="middle" font-family="'Inter',sans-serif" font-size="12" fill="#8fd8bd">Classe CE2 · Section A</text>
    <rect x="60" y="192" width="180" height="30" rx="15" fill="#16a374"/>
    <text x="150" y="212" text-anchor="middle" font-family="'Inter',sans-serif" font-size="12" font-weight="700" fill="#eafff6">FICHE ÉLÈVE COMPLÈTE</text>
  </g>

  <!-- Staff card -->
  <g filter="url(#cardShadow)" transform="translate(520 120)">
    <rect width="300" height="240" rx="20" fill="#0e5a42" stroke="#b8862f" stroke-width="2.5"/>
    <!-- avatar -->
    <circle cx="150" cy="86" r="42" fill="url(#gold)"/>
    <circle cx="150" cy="76" r="16" fill="#7a5a1f"/>
    <path d="M150 66 a18 18 0 0 1 18 18 h-36 a18 18 0 0 1 18 -18 Z" fill="#7a5a1f" transform="translate(0 26)"/>
    <text x="150" y="150" text-anchor="middle" font-family="'Inter',sans-serif" font-size="18" font-weight="800" fill="#ffffff">Omar Ndiaye</text>
    <text x="150" y="172" text-anchor="middle" font-family="'Inter',sans-serif" font-size="12" fill="#8fd8bd">Professeur de Mathématiques</text>
    <rect x="60" y="192" width="180" height="30" rx="15" fill="#b8862f"/>
    <text x="150" y="212" text-anchor="middle" font-family="'Inter',sans-serif" font-size="12" font-weight="700" fill="#eafff6">ENSEIGNANT · RÔLE</text>
  </g>

  <!-- photo / badge chips at bottom -->
  <g filter="url(#cardShadow)" transform="translate(300 400)">
    <rect width="140" height="52" rx="12" fill="#0e5a42"/>
    <circle cx="26" cy="26" r="13" fill="url(#green)"/>
    <text x="48" y="23" font-family="'Inter',sans-serif" font-size="13" font-weight="700" fill="#eafff6">Photos</text>
    <text x="48" y="40" font-family="'Inter',sans-serif" font-size="10" fill="#8fd8bd">fiches</text>
  </g>
  <g filter="url(#cardShadow)" transform="translate(540 400)">
    <rect width="140" height="52" rx="12" fill="#0e5a42"/>
    <circle cx="26" cy="26" r="13" fill="url(#gold)"/>
    <text x="48" y="23" font-family="'Inter',sans-serif" font-size="13" font-weight="700" fill="#eafff6">Classes</text>
    <text x="48" y="40" font-family="'Inter',sans-serif" font-size="10" fill="#8fd8bd">groupes</text>
  </g>

  <text x="480" y="530" text-anchor="middle" font-family="'Inter',sans-serif" font-size="18" fill="#cfe9dc">Fiches complètes · Photos · Rôles de connexion</text>
</svg>
